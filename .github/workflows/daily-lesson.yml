name: 每日日文學習更新

on:
  schedule:
    - cron: '0 0 * * *'   # 台灣時間早上 8:00
    - cron: '0 8 * * *'   # 台灣時間下午 4:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 早上8點執行新聞分析
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-news.js

      - name: 下午4點執行美句生成
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-poem.js

      - name: 推送更新
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.com'
          git add today.json today-poem.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "每日更新 $(date +'%Y-%m-%d %H:%M' -d '+8 hours')"
          git pull --rebase origin main
          git push origin main
