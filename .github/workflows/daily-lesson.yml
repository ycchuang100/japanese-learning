name: 每日日文學習更新

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-news:
    name: 早上8點 — 新聞分析
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 執行新聞分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-and-analyze.js

      - name: 提交更新
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.com'
          git add today.json
          git diff --staged --quiet || (git commit -m "每日新聞更新：$(date +'%Y-%m-%d')" && git pull --rebase && git push)

  afternoon-poem:
    name: 下午4點 — 美句生成
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 執行美句生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node daily-poem.js

      - name: 提交更新
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.com'
          git add today-poem.json
          git diff --staged --quiet || (git commit -m "每日美句更新：$(date +'%Y-%m-%d')" && git pull --rebase && git push)
